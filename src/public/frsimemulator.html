<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frsim :)</title>
  <link rel="icon" type="image/x-icon" href="favico/favicon.ico">
  <link href="datastyle.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="container mx-auto p-4" id="table">
    <div id="title">
      <h1 class="text-3xl font-bold mb-4">frsim :)</h1>
    </div>
    <div class="overflow-auto border rounded-lg shadow bg-white">
    </div>
<div id="external-page-host"></div>
</body>
<script>
  async function loadExternalPage() {
    const response = await fetch('/proxy/');
    const htmlText = await response.text();

    const host = document.getElementById('external-page-host');
    // Shadow DOM prevents the external page's CSS from breaking your main app
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = htmlText;

    // Manually execute <script> tags (browsers ignore scripts inserted via innerHTML)
    shadow.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      if (oldScript.src) {
        newScript.src = oldScript.src;
      } else {
        newScript.textContent = oldScript.textContent;
      }
      shadow.appendChild(newScript);
    });
  }

  loadExternalPage();
</script>
