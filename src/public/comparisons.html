<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparisons</title>
  <link rel="icon" type="image/x-icon" href="favico/favicon.ico">
  <link href="datastyle.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="container mx-auto p-4" id="table">
    <div id="title">
      <h1 class="text-3xl font-bold mb-4">Raw Data Dashboard</h1>
    </div>
    <div class="mb-4 flex justify-between items-center">
      <button id="start" class="button">Begin</button>
      <button id="explain" class="button">Explain</button>
    </div>
    <div class="overflow-auto border rounded-lg shadow bg-white">
        <div id="sickFlicks" class="adjacent-graph">
        </div>
    </div>
    <div>
      <button id="team1" class="button" hidden="hidden">Choose!</button>
      <p>&emsp;</p>
      <button id="team2" class="button" hidden="hidden">Choose!</button>
    </div>
  </div>
</body>
<script>
  let teamsList;
  let team1;
  let team2;
  
  document.addEventListener("DOMContentLoaded", async () => {
    rawTeamsString = await getScoutedTeams() + ',';
    teamsList = rawTeamsString.split(',')
    console.log (teamsList);
  });


  document.getElementById('start').addEventListener('click', ()=>{
    runComparisons();
  });

  function runComparisons() {
    copy = teamsList;
    team1index = Math.floor(Math.random()*copy.length);
    team1 = copy[team1index];
    copy.splice(team1index, 1);
    team2index = Math.floor(Math.random()*copy.length);
    team2 = copy[team2index];
    createComparision(team1, team2)
  }

  function createComparision(team1, team2) {
    const p1 = document.createElement('img');
    p1.src = "data/Teams/" + localStorage.getItem('team') + '/' + localStorage.getItem('team') + 'PitScouting' + '/' + (team1) + "picture.png";
    p1.width = 600;
    p1.height = 400;

    const space = document.createElement('p');
    space.innerHTML = '&nbsp;'; // optional: creates a visible space

    const p2 = document.createElement('img');
    p2.src = "data/Teams/" + localStorage.getItem('team') + '/' + localStorage.getItem('team') + 'PitScouting' + '/' + (team2) + "picture.png";
    p2.width = 600;
    p2.height = 400;

    const division = document.getElementById("sickFlicks");
    division.innerHTML='';

    division.appendChild(p1);
    division.appendChild(space);
    division.appendChild(p2);

    document.getElementById('team1').hidden = false;
    document.getElementById('team2').hidden = false;
  }

  document.getElementById('team1').addEventListener('click', async ()=> {
    if (confirm("are you sure you want to pick " + str(team1) + '?')) {
    await send(team1, team2);
    createComparision();
    }
  })

  document.getElementById('team2').addEventListener('click', async ()=> {
    if (confirm("are you sure you want to pick " + str(team2) + '?')) {
    await send(team2, team1);
    createComparision();
    }
  })

  document.getElementById('explain').addEventListener('click', ()=>{
    alert("not written (sorry ):")
  });

  async function send (winner, loser){
    const res = await fetch ("/logCompResults", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify([localStorage.getItem('team'), winner, loser]),
    });

    console.log(res);
    

    if (!res.ok){
      throw new Error("HTTP error " + res.status);
    }

    const json = await res.json();
    return(json);
  }

  async function getScoutedTeams() {
        const res = await fetch ("/getScoutedTeams", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify([localStorage.getItem('team')]),
    });

    console.log(res);
    

    if (!res.ok){
      throw new Error("HTTP error " + res.status);
    }

    const json = await res.json();
    return(json);
  }
</script>
</html>
